<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim</title>
    <link rel="stylesheet" href="../css/stiles/common.css">
    <link rel="stylesheet" href="../css/stiles/iletisim.css">
</head>
<body>
    <header>
        <a class="brand-link" href="homepage.html" aria-label="Oyun Atlası ana sayfası"><img class="brand-logo" src="../images/oyun-atlasi-logo-03.svg" alt="Oyun Atlası"></a>
        
        <nav>
            <ul class="isaretsiz-liste">
                <li><a href="homepage.html"><img class="nav-icon" src="../images/nav-home.svg" alt="">Anasayfa</a></li>
                <li><a href="giris.html"><img class="nav-icon" src="../images/nav-login.svg" alt="">Giriş</a></li>
                <li><a href="kayit.html"><img class="nav-icon" src="../images/nav-register.svg" alt="">Kayıt</a></li>
                <li><a href="iletisim.html"><img class="nav-icon" src="../images/nav-contact.svg" alt="">İletişim</a></li>
            </ul>
        </nav>

        <img class="profile-avatar" src="../images/profile-placeholder.svg" alt="Profil">
    </header>
    <main class="auth-card">
        <h1>İletişim</h1>
        <p>Burada bizimle iletişime geçip sitenin geliştirilmesi ve oyunlar hakınndaki bilgilerin güncel kalması için yorumlarınızı paylaşabilirsiniz.</p>
        <form >
            <label for="name">Adınız:</label>
            <input type="text" placeholder="Adınız" id="name" name="name" required><br><br>
            <label for="email">E-posta:</label>
            <input type="email" placeholder="E-posta" id="email" name="email" required><br><br>
            <label for="gamename">Oyun Seçiniz:</label>
            <select id="gamename" name="gamename" required>
                <option value="">Yorum için oyun Seçiniz</option>
                <option value="minecraft">Minecraft</option>
                <option value="eldenring">Elden Ring</option>
                <option value="terraria">Terraria</option>
                <option value="sevendaystodie">Seven Days to Die</option>
            </select><br><br>
            <label for="yorum" direction="ltr">Yorumunuz:</label>
            <textarea id="yorum" name="yorum" placeholder="Seçtiğiniz oyun hakkındaki yorumunuzu yazınız." required></textarea>
            <input class="iletisimbutton" type="submit" value="Gönder">
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Oyun Rehberi. Tüm hakları saklıdır.</p>
    </footer>
</body>
</html>
