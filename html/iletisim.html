<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/stiles/iletisim.css">
</head>
<body>
    <header>
        <h1>Oyun Rehberi</h1>
        <a href="homepage.html"><img  class="nav-icon" src="../css/backgrounds/sitelogo.jpg" alt="Oyun rehberi ana sayfasına ait, farklı oyun dünyalarının tanıtıldığı renkli bir manzara"></a><br>
        
        <nav>
            <ul class="isaretsiz-liste">
                <li><a href="homepage.html"><img class="nav-icon" src="../images/nav-home.svg" alt="">Anasayfa</a></li>
                <li><a href="giris.html"><img class="nav-icon" src="../images/nav-login.svg" alt="">Giriş</a></li>

            </ul>
        </nav>

    </header>
    <main class="auth-card">
        <h1>İletişim</h1>
        <p>Burada bizimle iletişime geçebilirsiniz.</p>
        <form >
            <label for="name">Adınız:</label>
            <input type="text" placeholder="Adınız" id="name" name="name" required><br><br>
            <label for="email">E-posta:</label>
            <input type="email" placeholder="E-posta" id="email" name="email" required><br><br>
            <label for="message">Mesaj:</label>
            <textarea placeholder="Mesajınız" id="message" name="message" required></textarea><br><br>
            <input class="iletisimbutton" type="submit" value="Gönder">
        </form>
    </main>
    <footer>

    </footer>
